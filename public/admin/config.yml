backend:
  name: github
  repo: Nelson-1969/lametisse-blog
  branch: main

auth_type: implicit
app_id: github-app-id

site_url: https://fantastic-cave.cloudvent.net
media_folder: public/images
public_folder: /images

collections:
  - name: blog
    label: Blog Articles
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Publication Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD", required: true }
      - { label: "Category", name: "category", widget: "select", options: ["Voyages", "Rencontres", "Découvertes", "Labutik"], required: true }
      - { label: "Article Summary", name: "excerpt", widget: "text", required: true }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Article Content", name: "body", widget: "markdown", required: true }
      - { label: "Description (SEO)", name: "description", widget: "text", required: false }
