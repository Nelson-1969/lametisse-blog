paths:
  source: src
  content: content
  data: src/data
  static: public
collections_config:
  blog:
    path: /src/content/blog
    icon: article
    url: /blog/[slug]
    disable_url: false
    include_developer_files: false
    _enabled_editors:
      - content
      - visual
    _inputs:
      title:
        type: text
        label: Article Title
        cascade: true
        required: true
      pubDate:
        type: datetime
        label: Publication Date
        cascade: true
        required: true
      category:
        type: select
        options:
          allow_empty: true
          values:
            - Voyages
            - Rencontres
            - Découvertes
            - Labutik
          required: false
        label: Category
        cascade: true
        required: true
      excerpt:
        type: textarea
        label: Article Summary
        comment: One-line summary that appears in blog listings
        cascade: true
        required: true
      content:
        type: markdown
        label: Article Content
        cascade: true
      image:
        type: image
        options:
          paths:
          allowed_sources:
          disable_upload_file: false
          disable_direct_input: false
          disable_upload_file_in_file_browser: false
          mime_type:
          accepts_mime_types:
          resize_style: contain
          width:
          height:
          expandable: false
          prevent_resize_existing_files: false
          sizes:
          max_file_size:
          max_file_size_message:
          required: false
          required_message:
          min_length:
          min_length_message:
          max_length:
          max_length_message:
          min_graphemes:
          min_graphemes_message:
          max_graphemes:
          max_graphemes_message:
          min_words:
          min_words_message:
          max_words:
          max_words_message:
          locale:
          pattern:
          pattern_message:
          empty_type:
        label: Featured Image
        comment: |-
          Main image for the article

          ![](/uploads/img-8970.jpeg)
        cascade: true
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
_editables:
  content:
    bold: true
    italic: true
    link: true
    h1: false
    h2: true
    h3: true
    h4: false
    h5: false
    h6: false
    ul: true
    ol: true
    blockquote: true
    code: true
    hr: true
    redo: true
    undo: true
    removeformat: true
timezone: Etc/UTC
image_extensions:
  - jpg
  - jpeg
  - png
  - gif
  - webp
_site_editor:
  editor: visual
hosting:
  cloudflare_pages:
    branch: main
generator: astro
